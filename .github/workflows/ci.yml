name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build
        env:
          NEXT_PUBLIC_FACTORY_ADDRESS: "0x0a12aEa5A35d7199F2B7cac3C14A7a9e470F561a"
